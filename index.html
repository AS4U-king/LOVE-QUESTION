<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Love Box</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; /* Prevents scrollbars when button moves */
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }
        .love-box {
            text-align: center;
            background: white;
            padding: 30px 20px;
            width: 85%;
            max-width: 350px;
            border-radius: 20px;
            box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.3);
            border: 3px solid #ff3366;
            box-sizing: border-box;
        }
        h2 {
            color: #ff3366;
            font-size: 24px;
            margin-top: 0;
        }
        .buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px; /* Spaces buttons nicely */
        }
        button {
            padding: 12px 25px;
            border: none;
            cursor: pointer;
            font-size: 18px;
            border-radius: 10px;
            transition: 0.3s;
            font-weight: bold;
        }
        .yes {
            background-color: #ff3366;
            color: white;
        }
        .yes:hover {
            background-color: #ff1a4d;
        }
        .no {
            background-color: gray;
            color: white;
            /* Removed absolute positioning here so it sits next to Yes initially */
        }
        .no:hover {
            background-color: darkgray;
        }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
        .shake {
            animation: shake 0.3s ease-in-out;
        }
        .popup {
            display: none;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background: linear-gradient(135deg, #ff0000, #005eff);
            padding: 25px;
            width: 85%;
            max-width: 350px;
            border-radius: 15px;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
            opacity: 0;
            transition: transform 0.4s ease-out, opacity 0.4s ease-out;
            color: rgb(255, 255, 255);
            font-size: 20px;
            border: 3px solid white;
            animation: glow 1.5s infinite alternate;
            box-sizing: border-box;
            z-index: 1000;
        }
        .popup h1 {
            font-size: 22px;
            margin: 10px 0;
        }
        @keyframes glow {
            0% { box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.5); }
            100% { box-shadow: 0px 0px 20px rgba(255, 255, 255, 1); }
        }
        .popup.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }
        .popup button {
            margin-top: 15px;
            background-color: white;
            color: #ff3366;
            padding: 10px 20px;
        }
        .watermark {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 14px;
            color: white;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="love-box">
        <h2>Do you love me? ❤️</h2>
        <div class="buttons">
            <button class="yes" onclick="sendEmail(); partyPopper();">Yes</button>
            <button class="no" onclick="moveNoButton()">No</button>
        </div>
    </div>
    
    <div id="popup" class="popup">
        <h1>Congratulations 🎉<br>You are now Ankit's GF 🥳</h1>
        <button onclick="closePopup()">OK</button>
    </div>
    
    <div class="watermark">Created by Ankit</div>

    <script>
        (function() {
            emailjs.init("bk7cKBzv2Z0N_dWXF"); 
        })();

        function sendEmail() {
            emailjs.send("lovequation-2007", "template_03kv9wb", {
                to_name: "Ankit",
                message: "Someone said 'Yes' to loving you! ❤️",
                reply_to: "hobekichu@gmail.com"
            }).then(function(response) {
                alert("Love you too ❤️");  
                showPopup();
            }, function(error) {
                console.error("Error:", error);
                showPopup();
            });
        }

        function showPopup() {
            let popup = document.getElementById("popup");
            popup.style.display = "block";
            setTimeout(() => {
                popup.classList.add("show");
            }, 10);
        }
        
        function closePopup() {
            let popup = document.getElementById("popup");
            popup.classList.remove("show");
            setTimeout(() => {
                popup.style.display = "none";
            }, 300);
        }

        function moveNoButton() {
            let noButton = document.querySelector('.no');
            noButton.classList.add('shake');
            
            setTimeout(() => {
                noButton.classList.remove('shake');
                
                // Change position to fixed so it moves relative to the entire screen
                noButton.style.position = 'fixed';
                
                // Calculate max available X and Y space keeping the button inside the screen limits
                let maxX = window.innerWidth - noButton.offsetWidth - 20; 
                let maxY = window.innerHeight - noButton.offsetHeight - 20;
                
                // Generate random coordinates (ensure they stay slightly away from edges)
                let x = Math.max(10, Math.random() * maxX);
                let y = Math.max(10, Math.random() * maxY);
                
                noButton.style.left = `${x}px`;
                noButton.style.top = `${y}px`;
            }, 300);
        }

        function partyPopper() {
            confetti({
                particleCount: 300,
                spread: 120,
                startVelocity: 50,
                origin: { y: 0.6 },
                zIndex: 2000
            });
        }
    </script>
</body>
</html>
